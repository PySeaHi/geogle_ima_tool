<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMA 下载工具</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>IMA 文档批量下载</h1>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="status">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">检测中...</span>
        </div>
        <button id="refresh-btn-main" class="btn-small hidden">刷新</button>
      </div>
    </header>

    <!-- 登录提示 -->
    <div id="login-hint" class="hidden">
      <div style="font-size: 48px; margin-bottom: 16px;">🔐</div>
      <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 12px; color: var(--text-primary);">需要登录 IMA</h2>
      <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px;">
        请先在 IMA 网站登录您的账号，<br>然后返回此页面点击刷新按钮
      </p>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button id="open-ima-btn" class="btn btn-primary">
          <span style="font-size: 16px;">🌐</span>
          打开 IMA
        </button>
        <button id="refresh-btn" class="btn btn-secondary">
          <span style="font-size: 16px;">🔄</span>
          刷新状态
        </button>
      </div>
    </div>

    <!-- 主界面 -->
    <div id="main-content" class="hidden">
      <!-- 使用说明 -->
      <div class="usage-tip">
        <p>使用方法：选择知识库 → 扫描文件 → 选择保存位置 → 开始下载</p>
      </div>

      <!-- 步骤1: 选择知识库 -->
      <div class="step">
        <div class="step-header">
          <span class="step-number">1</span>
          <span>选择知识库</span>
        </div>
        <div class="step-content">
          <button id="load-kb-btn" class="btn btn-secondary">加载知识库列表</button>
          <div id="kb-list" class="kb-list hidden"></div>
        </div>
      </div>

      <!-- 步骤2: 扫描文件 -->
      <div class="step">
        <div class="step-header">
          <span class="step-number">2</span>
          <span>扫描文件</span>
        </div>
        <div class="step-content">
          <div id="selected-kb" class="selected-info hidden">
            已选择: <span id="selected-kb-name"></span>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <button id="scan-btn" class="btn btn-secondary" disabled>扫描文件</button>
            <button id="clear-cache-btn" class="btn-small" title="清除所有扫描缓存，释放存储空间">清除缓存</button>
          </div>
          <div id="scan-progress" class="progress hidden">
            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>
            <span class="progress-text">已扫描: <span id="file-count">0</span> 个文件, <span id="folder-count">0</span> 个文件夹</span>
          </div>
        </div>
      </div>

      <!-- 步骤3: 下载 -->
      <div class="step">
        <div class="step-header">
          <span class="step-number">3</span>
          <span>下载文件</span>
        </div>
        <div class="step-content">
          <div id="scan-result" class="selected-info hidden">
            共 <span id="total-files">0</span> 个文件 · 已下载 <span id="downloaded-files">0</span> · 未下载 <span id="undownloaded-files">0</span> · 已选择 <span id="selected-files">0</span> 个
          </div>
          <div id="file-list-section" class="hidden">
            <div class="file-list-header">
              <label class="select-all-label">
                <input type="checkbox" id="select-all-checkbox" checked>
                <span>全选</span>
              </label>
              <div style="display: flex; gap: 8px; align-items: center;">
                <button id="select-undownloaded-btn" class="btn-small">全选未下载</button>
                <button id="collapse-all-btn" class="btn-small">全部折叠</button>
              </div>
            </div>
            <div id="file-list" class="file-list tree-view"></div>
          </div>
          <div class="save-path-section">
            <label for="save-path-input">保存位置</label>
            <input type="text" id="save-path-input" class="save-path-input" placeholder="点击选择保存文件夹（直接写入所选文件夹）" readonly>
            <input type="file" id="folder-picker" webkitdirectory style="display:none">
          </div>
          <button id="download-btn" class="btn btn-primary" disabled>开始下载</button>
          <div id="download-progress" class="progress hidden">
            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>
            <span class="progress-text">
              进度: <span id="downloaded-count">0</span>/<span id="total-count">0</span>
              (失败: <span id="failed-count">0</span>)
            </span>
            <div id="current-file" class="current-file"></div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
              <button id="pause-btn" class="btn-small">暂停</button>
              <button id="cancel-btn" class="btn-small" style="color: var(--error-color); border-color: var(--error-color);">取消下载</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 日志 -->
    <div id="log-section" class="log-section">
      <div class="log-header">
        <span>日志</span>
        <button id="clear-log-btn" class="btn-small">清空</button>
      </div>
      <div id="log-content" class="log-content"></div>
    </div>
  </div>

  <!-- 下载确认模态框 -->
  <div id="download-confirm-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>确认下载</h3>
        <button id="modal-close-btn" class="btn-small" title="关闭">×</button>
      </div>
      <div class="modal-summary">
        选中 <span id="modal-total">0</span> 个文件 ·
        已下载 <span id="modal-done">0</span>（将跳过）·
        将下载 <span id="modal-todo">0</span>
      </div>
      <div id="modal-file-list" class="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-cancel-btn" class="btn btn-secondary">取消</button>
        <button id="modal-confirm-btn" class="btn btn-primary">确认下载</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
